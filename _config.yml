# Shiwen An's personal site. Plain Jekyll: one layout, no plugins, no scripts.
title: Shiwen An
author: Shiwen An
url: https://zazabap.github.io
baseurl: ""
lang: en
timezone: Asia/Tokyo

# Navigation, in order. The Blog entry is only shown once a post exists
# (see _layouts/default.html).
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: News
    url: /news/
  - title: Blog
    url: /blog/
  - title: CV
    url: /assets/pdf/resume.pdf

# Links shown at the top right of every page.
links:
  - title: GitHub
    url: https://github.com/zazabap
  - title: Google Scholar
    url: https://scholar.google.com/citations?user=RVarZsQAAAAJ
  - title: Email
    url: mailto:an.s.aa@m.titech.ac.jp

markdown: kramdown
kramdown:
  input: GFM
highlighter: none # plain <pre><code>, no syntax colouring

permalink: /blog/:year/:title/
future: true # a dated _news entry is listed as soon as it is pushed

collections:
  news:
    output: false # listed on / and /news/; no standalone pages
  projects:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
